id: e3_random_forest
family: random_forest
hypothesis: >-
  Los ataques dependen de combinaciones (protocolo + estado + TTL + bytes) que un
  modelo lineal no captura; un bosque de árboles debería subir recall y precision.
change: Cambio de familia a árboles (bagging), mismo preprocesamiento que e1.
preprocessing: {log1p: false, min_frequency: 20}
params: {n_estimators: 200, max_depth: 20, min_samples_leaf: 2, n_jobs: -1}
threshold: 0.5
