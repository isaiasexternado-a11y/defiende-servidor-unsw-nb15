id: e4_hist_gradient_boosting
family: hist_gradient_boosting
hypothesis: >-
  Boosting corrige secuencialmente los errores de árboles poco profundos; con las
  mismas entradas debería mejorar la calidad de las probabilidades frente al bosque
  y dar un modelo más liviano.
change: Frente a e3, árboles en boosting en vez de bagging.
preprocessing: {log1p: false, min_frequency: 20}
params: {max_iter: 300, learning_rate: 0.1, max_leaf_nodes: 31, early_stopping: false}
threshold: 0.5
